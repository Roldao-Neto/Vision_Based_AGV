  <!-- NOTAS -->
  <text x="570" y="1462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c92a2a">⚠ As cores do chicote variam por lote: confirme na serigrafia da plaquinha do encoder (M1 · GND · C1 · C2 · VCC · M2) antes de ligar.</text>
  <text x="570" y="1484" text-anchor="middle" font-size="10.5" font-style="italic" fill="#868e96">Posições dos pinos meramente ilustrativas — siga os nomes. STBY pode ir num GPIO (ex.: D12) se preferir controlar por software.</text>
