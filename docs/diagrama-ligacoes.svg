  <circle cx="705" cy="220" r="4.5" fill="#212529"/>
  <line x1="585" y1="220" x2="633" y2="220" stroke="#e03131" stroke-width="2.5"/>
  <line x1="633" y1="204" x2="633" y2="236" stroke="#212529" stroke-width="3.5"/>
