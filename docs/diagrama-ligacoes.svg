  <text x="1000" y="1022" text-anchor="middle" font-size="11" font-weight="bold" fill="#212529">GND</text>
  <text x="561" y="1040" text-anchor="middle" font-size="9.5" fill="#868e96">controle da ponte H</text>
  <text x="850" y="1040" text-anchor="middle" font-size="9.5" fill="#868e96">entradas dos encoders</text>
  <text x="980" y="1040" text-anchor="middle" font-size="9.5" fill="#868e96">encoders</text>
  <text x="585" y="1125" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">Arduino UNO Q</text>
  <text x="585" y="1150" text-anchor="middle" font-size="12" fill="#343a40">GPIO em 3,3 V — alimentado apenas pelo powerbank (USB-C)</text>
