  <circle cx="585" cy="275" r="4.5" fill="#e03131"/>
  <circle cx="705" cy="275" r="4.5" fill="#212529"/>
  <line x1="585" y1="275" x2="637" y2="275" stroke="#e03131" stroke-width="2.5"/>
