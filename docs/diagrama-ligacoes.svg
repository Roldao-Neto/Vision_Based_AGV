<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1510" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1140" height="1510" fill="#ffffff"/>

  <!-- TITULO -->
  <text x="570" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#212529">Ligações completas — 2× JGB37-520 + TB6612FNG + Arduino UNO Q</text>
  <text x="570" y="62" text-anchor="middle" font-size="12" fill="#868e96">diagrama de blocos: alimentação, motores, encoders e sinais</text>

  <!-- ZONA DE SOLDA (chicote) -->
  <rect x="188" y="70" width="587" height="245" rx="10" fill="none" stroke="#adb5bd" stroke-dasharray="7 5" stroke-width="1.5"/>
  <text x="204" y="303" font-size="11.5" font-style="italic" fill="#868e96">único trecho com solda (chicote da bateria)</text>

  <!-- BATERIA -->
  <rect x="25" y="95" width="150" height="90" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="100" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Bateria 3S</text>
  <text x="100" y="152" text-anchor="middle" font-size="12" fill="#495057">LiPo — 12,6 V cheia</text>
  <line x1="175" y1="120" x2="195" y2="120" stroke="#e03131" stroke-width="5"/>
  <line x1="175" y1="160" x2="195" y2="160" stroke="#212529" stroke-width="5"/>
  <text x="184" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#e03131">+</text>
  <text x="184" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">−</text>

  <!-- XT60 -->
  <rect x="195" y="100" width="64" height="80" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="227" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">XT60</text>
  <line x1="259" y1="120" x2="285" y2="120" stroke="#e03131" stroke-width="5"/>
  <line x1="259" y1="160" x2="705" y2="160" stroke="#212529" stroke-width="5"/>

  <!-- FUSIVEL -->
  <rect x="285" y="98" width="100" height="44" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="335" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Fusível</text>
  <text x="335" y="132" text-anchor="middle" font-size="11" fill="#495057">5 A (lâmina)</text>
  <line x1="385" y1="120" x2="410" y2="120" stroke="#e03131" stroke-width="5"/>

  <!-- CHAVE -->
  <rect x="410" y="98" width="95" height="44" rx="6" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <text x="457" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Chave</text>
  <text x="457" y="132" text-anchor="middle" font-size="10.5" fill="#495057">liga/desliga ≥ 5 A</text>
  <line x1="505" y1="120" x2="585" y2="120" stroke="#e03131" stroke-width="5"/>

  <!-- TRILHOS 12V e GND descendo ao modulo -->
  <line x1="585" y1="120" x2="585" y2="325" stroke="#e03131" stroke-width="5"/>
  <line x1="705" y1="160" x2="705" y2="325" stroke="#212529" stroke-width="5"/>
