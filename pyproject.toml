[project]
name = "vision-based-agv"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]
dev = [
    "arduino-app-bricks",
    "arduino-router-bridge>=0.5.1",
    "ai-edge-litert==2.3.0",
    "flask==3.1.3",
    "opencv-python-headless>=4.13,<4.14",
]

[tool.uv.sources]
arduino-app-bricks = { git = "https://github.com/arduino/app-bricks-py", tag = "release/0.12.0" }

[tool.basedpyright]
extraPaths = ["analysis", "bricks", "python"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.uv]
default-groups = ["dev", "analysis"]
